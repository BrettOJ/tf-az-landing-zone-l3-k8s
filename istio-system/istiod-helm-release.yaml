apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: istiod

  dependsOn:
    - name: istio-base
      namespace: istio-system

  chart:
    spec:
      chart: istiod
      version: "1.30.1"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    global:
      hub: docker.io/istio
      tag: "1.30.1"
      istioNamespace: istio-system

    autoscaleEnabled: false
    replicaCount: 1

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

    meshConfig:
      accessLogFile: /dev/stdout
      accessLogEncoding: JSON